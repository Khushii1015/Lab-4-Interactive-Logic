<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Check-In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>Daily Check-In</h1>
    <p id="greeting"></p>

    <form id="checkin-form"> <!-- The user's answers decide which mode they get -->
      <label for="name">Your name</label>
      <input type="text" id="name" required>

      <label for="sleep">Hours of sleep last night</label>
      <input type="number" id="sleep" min="0" max="24" required>

      <label for="mood">How do you feel?</label>
      <select id="mood">
        <option value="tired">Tired</option>
        <option value="okay">Okay</option>
        <option value="great">Great</option>
      </select>

      <button type="submit">Check in</button>
    </form>

    <section id="result" hidden> <!-- Filled in by script.js after a check-in -->
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <p id="history"></p>
      <button id="reset-btn">Start over</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
